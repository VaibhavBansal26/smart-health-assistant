<form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="brand"><span class="logo" aria-hidden="true">+</span> HealthCare</div>

  <div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your appointments.</p>
  </div>

  @if (error(); as message) {
    <div class="alert error" role="alert">{{ message }}</div>
  }

  <div class="field">
    <label for="email">Email</label>
    <input id="email" class="input" type="email" formControlName="email" autocomplete="email"
           placeholder="you@example.com" appAutofocus
           [class.invalid]="form.controls.email.invalid && form.controls.email.touched" />
    <app-field-error [control]="form.controls.email" />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" class="input" formControlName="password" autocomplete="current-password"
             [type]="showPassword() ? 'text' : 'password'"
             [class.invalid]="form.controls.password.invalid && form.controls.password.touched" />
      <button type="button" class="toggle" (click)="showPassword.set(!showPassword())">
        {{ showPassword() ? 'Hide' : 'Show' }}
      </button>
    </div>
    <app-field-error [control]="form.controls.password" />
  </div>

  <button type="submit" class="btn block" [disabled]="submitting()">
    @if (submitting()) { <app-spinner /> Signing in... } @else { Sign in }
  </button>

  <p class="switch muted">
    New here? <a routerLink="/register">Create an account</a>
  </p>
</form>
