<div class="backdrop" (click)="dismissed.emit()">
  <form class="dialog card stack" role="dialog" aria-modal="true" aria-labelledby="doc-title"
        [formGroup]="form" (ngSubmit)="submit()" (click)="$event.stopPropagation()"
        (keydown.escape)="dismissed.emit()" novalidate>
    <div>
      <h2 id="doc-title">{{ editing ? 'Edit doctor' : 'Add a doctor' }}</h2>
      @if (!editing) {
        <p class="muted">We email them a link to choose their own password. You never see or set it.</p>
      }
    </div>

    @if (error(); as message) {
      <div class="alert error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="d-name">Full name</label>
      <input id="d-name" class="input" formControlName="fullName" placeholder="Dr. Jane Smith" appAutofocus
             [class.invalid]="form.controls.fullName.invalid && form.controls.fullName.touched" />
      <app-field-error [control]="form.controls.fullName" />
    </div>

    <div class="field">
      <label for="d-email">Email</label>
      <input id="d-email" class="input" type="email" formControlName="email" placeholder="jane.smith@clinic.com"
             [class.invalid]="form.controls.email.invalid && form.controls.email.touched" />
      <app-field-error [control]="form.controls.email" />
    </div>

    <div class="field">
      <label for="d-spec">Specialty</label>
      <input id="d-spec" class="input" formControlName="specialty" placeholder="e.g. Cardiology"
             [class.invalid]="form.controls.specialty.invalid && form.controls.specialty.touched" />
      <app-field-error [control]="form.controls.specialty" />
    </div>

    <div class="row actions">
      <button type="button" class="btn secondary" (click)="dismissed.emit()">Cancel</button>
      <button type="submit" class="btn" [disabled]="submitting()">
        @if (submitting()) { <app-spinner /> Saving... } @else { {{ editing ? 'Save changes' : 'Send invitation' }} }
      </button>
    </div>
  </form>
</div>
